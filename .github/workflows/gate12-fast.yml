name: gate12-fast

on:
  pull_request:

jobs:
  gate12:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q test_gate12_collision_or_optimization.py
      - run: python gate12_collision_or_optimization.py --out results --seeds 3 --extra-local-attempts 7200
      - uses: actions/upload-artifact@v4
        with:
          name: gate12-results-py${{ matrix.python-version }}
          path: results/gate12_collision_or_optimization.json
