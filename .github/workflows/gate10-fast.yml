name: gate10-fast

on:
  pull_request:

jobs:
  gate10:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q test_gate10_dense_operator_readback.py
      - run: python gate10_dense_operator_readback.py --out results --seeds 3 --attempts 1600
      - uses: actions/upload-artifact@v4
        with:
          name: gate10-results-py${{ matrix.python-version }}
          path: results/gate10_dense_operator_readback.json
