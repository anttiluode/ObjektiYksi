name: gate11-fast

on:
  pull_request:

jobs:
  gate11:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q test_gate11_two_address_operator_family.py
      - run: python gate11_two_address_operator_family.py --out results --seeds 3 --joint-attempts 2400 --isolated-attempts 1800
      - uses: actions/upload-artifact@v4
        with:
          name: gate11-results-py${{ matrix.python-version }}
          path: results/gate11_two_address_operator_family.json
