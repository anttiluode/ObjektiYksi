name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - run: python self_carving.py --out results
      - run: python gate1_route_or_resonance.py --out results
      - run: python gate2_local_dither.py --out results --seeds 6
      - uses: actions/upload-artifact@v4
        with:
          name: gate0-2-results-py${{ matrix.python-version }}
          path: |
            results/gate0.json
            results/gate0_topology.svg
            results/gate1_route_or_resonance.json
            results/gate2_local_dither.json
            results/gate2_dither_topology.svg
