name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - run: python self_carving.py --out results
      - run: python gate1_route_or_resonance.py --out results
      - run: python gate2_local_dither.py --out results --seeds 6
      - run: python gate3_multiport_dither.py --out results --seeds 6
      - run: python gate4_routing_basin.py --out results --seeds 6
      - run: python gate5_multisource_basin.py --out results --seeds 4
      - run: python gate5_long_confirm.py --out results --seeds 3 --attempts 1600
      - run: python gate6_learned_addressing.py --out results --seeds 3 --epochs 20 --slow-proposals 24
      - run: python gate6_moving_target.py --out results --seeds 3 --epochs 45 --slow-proposals 36
      - run: python gate6_online_selector.py --out results --seeds 3 --epochs 30 --slow-proposals 24
      - run: python gate7_address_ablation.py --out results --seeds 3 --epochs 30 --slow-proposals 24
      - run: python gate8_crossed_spatial_map.py --out results --seeds 3 --attempts 1200
      - run: python gate9_address_optimum_moves.py --out results --seeds 3 --attempts 1200
      - run: python gate10_dense_operator_readback.py --out results --seeds 3 --attempts 1600
      - run: python gate11_two_address_operator_family.py --out results --seeds 3 --joint-attempts 2400 --isolated-attempts 1800
      - run: python gate12_collision_or_optimization.py --out results --seeds 3 --extra-local-attempts 7200
      - uses: actions/upload-artifact@v4
        with:
          name: gate0-12-results-py${{ matrix.python-version }}
          path: |
            results/gate0.json
            results/gate0_topology.svg
            results/gate1_route_or_resonance.json
            results/gate2_local_dither.json
            results/gate2_dither_topology.svg
            results/gate3_multiport_dither.json
            results/gate3_multiport_topology.svg
            results/gate4_routing_basin.json
            results/gate5_multisource_basin.json
            results/gate5_multisource_topology.svg
            results/gate5_long_confirm.json
            results/gate6_learned_addressing.json
            results/gate6_learned_addressing_topology.svg
            results/gate6_moving_target.json
            results/gate6_moving_target_topology.svg
            results/gate6_online_selector.json
            results/gate6_online_selector_topology.svg
            results/gate7_address_ablation.json
            results/gate7_position_only_topology.svg
            results/gate8_crossed_spatial_map.json
            results/gate8_crossed_topology.svg
            results/gate9_address_optimum_moves.json
            results/gate10_dense_operator_readback.json
            results/gate11_two_address_operator_family.json
            results/gate12_collision_or_optimization.json
