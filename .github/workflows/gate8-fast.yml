name: gate8-fast

on:
  pull_request:

jobs:
  gate8:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q test_gate8_crossed_spatial_map.py
      - run: python gate8_crossed_spatial_map.py --out results --seeds 3 --attempts 1200
      - uses: actions/upload-artifact@v4
        with:
          name: gate8-fast-py${{ matrix.python-version }}
          path: |
            results/gate8_crossed_spatial_map.json
            results/gate8_crossed_topology.svg
