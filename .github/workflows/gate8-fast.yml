name: gate8-fast

on:
  pull_request:

jobs:
  gate8:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q test_gate8_move_address_optimum.py
      - run: python gate8_move_address_optimum.py --out results --seeds 3 --epochs 60 --slow-proposals 40
      - uses: actions/upload-artifact@v4
        with:
          name: gate8-fast-py${{ matrix.python-version }}
          path: |
            results/gate8_move_address_optimum.json
            results/gate8_forced_topology.svg
